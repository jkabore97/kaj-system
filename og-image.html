<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #050506; color: #fff; position: relative; }
  .b1 { position: absolute; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(closest-side, rgba(124,58,237,.55), transparent); left: -160px; top: -220px; }
  .b2 { position: absolute; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(closest-side, rgba(168,85,247,.4), transparent); right: -160px; bottom: -240px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 46px 46px; opacity:.6; }
  .wrap { position: absolute; inset: 0; padding: 72px 82px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 18px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; }
  .logo svg { width: 60px; height: 60px; }
  h1 { font-family: 'Space Grotesk'; font-weight: 700; font-size: 82px; line-height: 1.04; letter-spacing: -0.03em; margin: 0; }
  h1 .p { background: linear-gradient(100deg,#a855f7,#7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .m { color: #868da8; }
  p { font-size: 27px; color: #c3c8de; margin: 22px 0 0; max-width: 860px; }
  .pill { align-self:flex-start; display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border:1px solid rgba(255,255,255,.16); border-radius:999px; font-size:18px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#c4b5fd; }
  .pill .d { width:9px;height:9px;border-radius:50%;background:#a855f7;box-shadow:0 0 12px #a855f7; }
</style></head>
<body>
  <div class="b1"></div><div class="b2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M20 16v32M20 32l18-16M22 34l18 14" fill="none" stroke="#050506" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>Kaj System</div>
    <div><span class="pill"><span class="d"></span>AI-powered custom apps</span><h1 style="margin-top:22px">Ship your <span class="p">app</span> in weeks,<br><span class="m">not months.</span></h1><p>Mobile apps, websites and custom business systems. Fixed prices, clear timelines.</p></div>
    <div style="font-size:22px;color:#868da8">kajsystem.com</div>
  </div>
</body></html>
